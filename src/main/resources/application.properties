# ─── Server ───────────────────────────────────────────────────────────────────
server.port=8080

# ─── H2 In-Memory Database ────────────────────────────────────────────────────
spring.datasource.url=jdbc:h2:mem:mpesadb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ─── Simulator Config ─────────────────────────────────────────────────────────
# Delay (ms) before the simulated callback fires — mimics real Safaricom latency
mpesa.simulator.callback-delay-ms=5000

# Success rate: 0.0 = always fail, 1.0 = always succeed
mpesa.simulator.success-rate=0.8

# ─── Basic Auth Credentials (mirrors Daraja consumer key:secret pattern) ──────
mpesa.auth.consumer-key=testConsumerKey
mpesa.auth.consumer-secret=testConsumerSecret

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.denzel.mpesa=DEBUG
